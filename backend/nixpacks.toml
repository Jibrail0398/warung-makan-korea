[phases.setup]
aptPkgs = [
    "ca-certificates",
    "chromium",
    "git",
    "unzip",
    "zip"
]

[phases.install]
cmds = [
    "...",
    "if [ -f vendor/kstmostofa/laravel-whatsapp/sidecar/package-lock.json ]; then PUPPETEER_SKIP_DOWNLOAD=true PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm ci --omit=dev --prefix vendor/kstmostofa/laravel-whatsapp/sidecar; else PUPPETEER_SKIP_DOWNLOAD=true PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm install --omit=dev --prefix vendor/kstmostofa/laravel-whatsapp/sidecar; fi"
]

[start]
cmd = "sh ./scripts/railway-start.sh"
